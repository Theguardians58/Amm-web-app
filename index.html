<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ammi's Kachhi - Comfort & Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ammi: {
                cream: '#FAFAFA',      /* Very light gray/white */
                maroon: '#BE123C',     /* Modern Rose 700 */
                maroonLight: '#FB7185',/* Rose 400 */
                indigo: '#334155',     /* Slate 700 */
                mehndi: '#059669',     /* Emerald 600 */
                gold: '#FBBF24',       /* Amber 400 */
                softPink: '#FFF1F2',   /* Rose 50 */
                lavender: '#F3E8FF',   /* Purple 100 */
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FAFAFA; /* ammi-cream */
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar for a softer look */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #E5E7EB; 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D1D5DB; 
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">

    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>

</head>
